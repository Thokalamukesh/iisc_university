name: api_selfxo_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  provider: ^6.1.2
  shared_preferences: 2.2.2
  device_info_plus: ^10.1.0
  uuid: ^4.4.0
  add_to_cart_animation: 2.0.3
  flutter_screenutil: ^5.9.0
  path_provider: 2.1.4
  intl: ^0.19.0
  csv: ^6.0.0
  fl_chart: ^0.66.2
  audioplayers: 5.2.1
  qr_flutter: ^4.1.0
  flutter_tts: 3.8.3
  connectivity_plus: ^6.0.0
  sunmi_printer_plus: ^2.1.1
  esc_pos_printer: ^4.1.0
  esc_pos_utils: ^1.1.0
  usb_serial: ^0.5.1
  font_awesome_flutter: 10.7.0
  simple_gradient_text: 1.3.0
  wakelock_plus: 1.1.4
  url_launcher: 6.3.1
  flutter_svg: ^2.0.10+1
  flutter_background_service: ^5.1.0
  mqtt_client: ^10.3.0
  barcode_widget: ^2.0.4
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  firebase_auth_platform_interface: ^7.4.4
  go_router: 13.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.11.0
  flutter_lints: ^4.0.0

# Only keep this override
dependency_overrides:
  flutter_background_service_android:
    path: third_party/flutter_background_service_android

flutter_icons:
  android: true
  ios: true
  image_path: "assets/selfxfavicon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/logo.jpg
    - assets/lo.png
    - assets/self.png
    - assets/selfxfavicon.jpg
    - assets/bglr.jpeg
    - assets/catall.jpg
    - assets/alll.jpg
    - assets/spalsh.jpeg
    - assets/payment_icons/
    - assets/images/
