<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SELFX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SELFX</title>
  <link rel="manifest" href="manifest.json">

  <script>
    document.title = 'SELFX';
    window.addEventListener('DOMContentLoaded', function () {
      document.title = 'SELFX';
    });
    window.addEventListener('focus', function () {
      document.title = 'SELFX';
    });
    document.addEventListener('visibilitychange', function () {
      document.title = 'SELFX';
    });
  </script>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <script>
    // Load flutter.js with build-version cache busting so clients don't stick
    // to previously cached immutable runtime files after deployment.
    (function loadFlutterJs() {
      const script = document.createElement('script');
      const version = serviceWorkerVersion || Date.now().toString();
      script.src = `flutter.js?v=${version}`;
      script.defer = true;
      document.head.appendChild(script);
    })();
  </script>
</head>
<body>
  <script>
    async function clearLegacyFlutterCaches() {
      if ('serviceWorker' in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        } catch (_) {}
      }

      if ('caches' in window) {
        try {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        } catch (_) {}
      }
    }

    window.addEventListener('load', function(ev) {
      clearLegacyFlutterCaches().finally(function() {
        const version = serviceWorkerVersion || Date.now().toString();
        _flutter.loader.loadEntrypoint({
          entrypointUrl: 'main.dart.js?v=' + version,
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine().then(function(appRunner) {
              appRunner.runApp();
            });
          }
        });
      });
    });
  </script>
</body>
</html>
